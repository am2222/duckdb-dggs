#
# Test the *deployed* duck_dggs WASM artifact (community-extensions.duckdb.org)
# with our own wasm-sqllogictest action: the sqllogictest files and the SQL
# examples in the docs, both taken from the commit that was released (`ref` in
# description.yml), so a failure means the deployment rotted, not that the
# docs run ahead of the release.
#
# It does NOT test the current commit: the published artifact lags this repo by
# however long a release takes to reach community-extensions. What it catches is
# the deployment rotting underneath us (the engine moving on, a dependency such
# as spatial changing behaviour), which breaks users without any push to this
# repo, hence the schedule. The action and runner come from the checked-out
# branch, so changes to them are validated on push/PR.
#
name: WASM Deployed Test

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/WasmDeployedTest.yml'
      - '.github/actions/wasm-sqllogictest/**'
      - 'packages/duckdb-docs-live/src/**'
  pull_request:
    paths:
      - '.github/workflows/WasmDeployedTest.yml'
      - '.github/actions/wasm-sqllogictest/**'
      - 'packages/duckdb-docs-live/src/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISHED_URL: https://community-extensions.duckdb.org/v2.0.0/wasm_eh/duck_dggs.duckdb_extension.wasm

jobs:
  test-deployed-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The action and its runner. No submodules needed.
      - uses: actions/checkout@v4

      - name: Read the released ref
        id: ref
        run: echo "ref=$(yq '.repo.ref' description.yml)" >> "$GITHUB_OUTPUT"

      # The tests and docs that were released with the published build.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: released

      # A release that includes the live doc examples ships this file. Older
      # releases have untriaged docs, so there is nothing meaningful to check yet.
      - name: Check the released ref has live doc examples
        id: released
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if [[ -f released/docs/wasm-known-failures.json ]]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            msg="Released ref ${REF} predates the live doc examples; this check starts with the next release."
            echo "::notice::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the published extension
        if: steps.released.outputs.live == 'true'
        run: curl -fsSLo "$RUNNER_TEMP/duck_dggs.duckdb_extension.wasm" "$PUBLISHED_URL"

      - uses: ./.github/actions/wasm-sqllogictest
        if: steps.released.outputs.live == 'true'
        with:
          extension: duck_dggs
          extension-file: ${{ runner.temp }}/duck_dggs.duckdb_extension.wasm
          extension-source: ${{ env.PUBLISHED_URL }}
          tests: released/test/sql
          docs: released/docs
          published: 'true'
          known-failures: released/docs/wasm-known-failures.json
